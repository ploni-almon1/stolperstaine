<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stolpersteine Mapa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>

  <header id="app-header">
    <h1>🪨 Stolpersteine</h1>
    <div class="controls">
      <label class="switch">
        <input type="checkbox" id="toggle-cleaning" checked />
        <span>Stav čištění</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="toggle-grayscale" />
        <span>Černobílá</span>
      </label>
    </div>
  </header>

  <div id="map"></div>

  <!-- Detailní panel -->
  <aside id="detail-panel">
    <button id="close-detail">✕</button>
    <img id="detail-photo" src="" alt="Fotografie kamene" />
    <h2 id="detail-name"></h2>
    <p id="detail-address"></p>
    <p id="detail-bio"></p>
    
    <!-- Zde se bude zobrazovat datum a nový barevný štítek se stavem -->
    <p id="detail-cleaned"></p>

    <form id="cleaning-form">
      <h3>Zaznamenat čištění</h3>
      <div class="form-row">
        <label for="cleaning-text">Datum:</label>
        <input
          type="text"
          id="cleaning-text"
          placeholder="DD.MM.RRRR"
          maxlength="10"
          inputmode="numeric"
          autocomplete="off"
        />
      </div>
      <button type="submit" id="cleaning-submit">Uložit</button>
      <span id="cleaning-feedback" class="feedback hidden"></span>
    </form>

    <a id="detail-link" href="#" target="_blank">Zobrazit plný profil →</a>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script src="app.js?v=6"></script>
</body>
</html>
